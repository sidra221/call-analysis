# Production overrides — used with: docker compose -f docker-compose.yml -f docker-compose.prod.yml
services:
  web:
    ports:
      - "52847:8000"
    depends_on:
      - ai_service

  frontend:
    ports:
      - "41783:4173"
    environment:
      - VITE_API_BASE_URL=http://63.141.255.154:52847
      - VITE_WS_BASE_URL=ws://63.141.255.154:52847
    command: sh -c "npm run build && npm run preview -- --host 0.0.0.0 --port 4173"

  celery_worker:
    restart: unless-stopped
    depends_on:
      - ai_service
    environment:
      # Host network (from base compose) reaches AI via the mapped host port.
      - AI_SERVICE_URL=http://127.0.0.1:44781/analyze-call
      - CELERY_BROKER_URL=redis://127.0.0.1:6379/0
      - CELERY_RESULT_BACKEND=redis://127.0.0.1:6379/1
      - DB_HOST=127.0.0.1
      - DB_PORT=5433
      - REDIS_HOST=127.0.0.1

  celery_beat:
    restart: unless-stopped
    depends_on:
      - redis
      - celery_worker

  redis:
    restart: unless-stopped

  # Rebuild when ai_service/ changes (rsync); image tag stays fixed for compose.
  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    image: call-analysis-ai_service
    container_name: call_analysis_ai_service
    ports:
      - "44781:9000"
    restart: unless-stopped
    env_file:
      - .env
