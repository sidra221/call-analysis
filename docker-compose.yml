name: call_analysis

services:

  web:
    build:
      context: .
      dockerfile: Dockerfile
      network: host

    container_name: call_analysis_backend

    working_dir: /app/backend

    command: sh -c "python manage.py migrate --noinput --skip-checks && daphne -b 0.0.0.0 -p 8000 config.asgi:application"

    volumes:
      - .:/app

    ports:
      - "8001:8000"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

    extra_hosts:
      - "host.docker.internal:host-gateway"

    dns:
      - 8.8.8.8
      - 1.1.1.1

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs/')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s


  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      network: host

    container_name: call_analysis_celery_worker

    working_dir: /app/backend

    command: celery -A config worker -l info --concurrency=2

    # Reach the local AI service on :9000 (AI stays outside Docker).
    network_mode: host

    volumes:
      - .:/app

    env_file:
      - .env

    environment:
      - CELERY_BROKER_URL=redis://127.0.0.1:6379/0
      - CELERY_RESULT_BACKEND=redis://127.0.0.1:6379/1
      - AI_SERVICE_URL=http://127.0.0.1:9000/analyze-call
      - DB_HOST=127.0.0.1
      - DB_PORT=5433
      - REDIS_HOST=127.0.0.1

    depends_on:
      - web
      - redis


  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
      network: host

    container_name: call_analysis_celery_beat

    working_dir: /app/backend

    command: celery -A config beat -l info

    volumes:
      - .:/app

    env_file:
      - .env

    depends_on:
      - web
      - redis

    extra_hosts:
      - "host.docker.internal:host-gateway"

    dns:
      - 8.8.8.8
      - 1.1.1.1


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host

    container_name: call_analysis_frontend

    ports:
      - "3001:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      - PORT=3000
      - HOST=0.0.0.0
      # Browser talks to the mapped backend port. Do not inherit ngrok URLs
      # from root .env — those are for the Flutter app only.
      - VITE_API_BASE_URL=http://localhost:8001
      - VITE_WS_BASE_URL=ws://localhost:8001
      - VITE_API_PROXY_TARGET=http://web:8000

    depends_on:
      web:
        condition: service_healthy


  db:
    image: postgres:15

    container_name: call_analysis_db

    environment:
      POSTGRES_DB: call_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data/

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d call_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  pgadmin:
    image: dpage/pgadmin4

    container_name: call_analysis_pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    depends_on:
      - db


  redis:
    image: redis:7-alpine

    container_name: call_analysis_redis

    ports:
      - "6379:6379"


volumes:
  postgres_data: